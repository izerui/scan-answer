<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>结果页 C · 左栏管整批，右边只管这一份</title>
<link rel="stylesheet" href="../toolbar/shell.css">
<link rel="stylesheet" href="results-common.css">
<script src="results-common.js"></script>
<style>
  .body { flex: 1; display: grid; grid-template-columns: 312px 1fr; min-height: 0; }
  /* 左栏：整批 */
  .left { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
  .bhd { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: var(--header); border-bottom: 1px solid var(--line); }
  .bhd .crumb { flex: 1; display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
  .bhd .crumb small { font-size: 12px; color: var(--ink3); }
  .left .ctl { padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
  .left .ctl .row { display: flex; align-items: center; gap: 8px; } .left .ctl .row .sp { flex: 1; }
  .card { margin: 0 10px 10px; border: 1px solid var(--line2); border-radius: 8px; background: var(--work); }
  .card .hint { padding: 9px 12px; font-size: 13px; line-height: 1.5; background: var(--warn-bg); border-radius: 8px 8px 0 0; border-bottom: 1px solid var(--line); }
  .card .hint b { color: var(--warn); margin-right: 4px; }
  .sec { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sec .t { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .sec .t .sp { flex: 1; }
  .sec .t small { font-weight: 400; font-size: 12px; color: var(--ink3); }
  .sec .ops { display: flex; gap: 6px; } .sec .ops button { flex: 1; justify-content: center; padding: 0 6px; }
  .stepr { display: grid; grid-template-columns: 132px 1fr; gap: 8px; align-items: center; font-size: 12px; color: var(--ink3); }
  .stepr button { justify-content: center; }
  .stepr .cap { line-height: 1.35; }
  /* 右边：这一份 */
  .stu { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .shd { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; background: var(--header); border-bottom: 1px solid var(--line); }
  .shd .info { flex: 1; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shd .kh { font-size: 12px; color: var(--ink3); }
  .split { flex: 1; display: grid; grid-template-columns: 1fr 392px; min-height: 0; }
  .center { background: var(--work); display: flex; flex-direction: column; min-width: 0; padding: 0 20px; }
  .tabrow { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); margin: 6px 0 10px; }
  .tabrow .tools { display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }
  .center .legend { margin-bottom: 8px; }
  .anoms { margin-top: 10px; }
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side .hd { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-weight: 600; }
  .side .hd .sp { flex: 1; } .side .hd small { font-weight: 400; font-size: 12px; color: var(--ink3); }
  .side .subhd { border-top: 1px solid var(--line); }
  .subjs { padding: 0 16px; overflow: hidden; flex: 1; }
  .pop { position: absolute; left: calc(100% + 8px); bottom: 10px; width: 520px; background: var(--work); border: 1px solid var(--line2); border-radius: 8px;
    box-shadow: 0 10px 28px #000b; padding: 12px 14px; z-index: 9; display: none; }
  .pop h3 { font-size: 13px; font-weight: 600; margin: 4px 0 2px; }
  .pop .meta { font-size: 12px; color: var(--ink3); }
  body.detail .pop { display: block; }
</style></head>
<body><div class="app">
  <script>document.write(R.rail)</script>
  <div class="main"><div class="body">
    <!-- 左栏：管整批。上面挑学生，下面常驻批次状态卡（转写 + 交付） -->
    <div class="left">
      <div class="bhd"><div class="crumb"><h2>第 2 批 · 0526_上午</h2><small>考研管理类综合能力 2026</small></div>
        <button title="重新读取这一批的识别与转写结果；在扫描页重扫、作废后回来点它">刷新</button></div>
      <div class="ctl">
        <input class="search" placeholder="序号、考号或来源" title="按序号（如 0012）、考号或来源文件名筛选，边输边过滤；清空后显示全部">
        <div class="row"><script>document.write(R.filter)</script><span class="sp"></span><span class="muted">16 / 16 份</span></div>
      </div>
      <script>document.write(R.list(7))</script>
      <div class="card">
        <div class="hint" title="下一步该做什么，以及刚才操作的结果"><b>下一步</b><span id="hint"></span></div>
        <div class="sec">
          <div class="t">转写 <span class="help" title="转写：用大模型把手写内容（填空、作文、姓名）转成文字，需要先在设置页配置。不转写也能交付，只是没有文字；不打算再转写时可“放弃未完成转写”，免得挡住交付。">?</span>
            <span class="sp"></span><small>完成 46 · <span class="err">失败 1</span> · <span class="warn">等待 1</span></small></div>
          <div class="ops"><button title="用大模型把手写内容转成文字：失败的重新转写，没开启转写的一并补做（可选）">补做和重试转写</button>
            <button title="不再转写这 1 项“等待转写”（标为未启用），这样就不挡交付；以后仍可补做">放弃未完成转写…</button></div>
        </div>
        <div class="sec">
          <div class="t">交付 <span class="help" title="检查交付：只检查不写文件；阻断项必须处理，说明项可以带着交付。生成交付目录：选一个文件夹，生成最终的 JSON + 图片">?</span><span class="sp"></span>
            <button class="link" id="detBtn">明细</button></div>
          <span class="pill bad" style="align-self:flex-start" title="检查时间：2026-05-26 10:42；生成目录时会重新检查">暂不可交付 · 1 项阻断 · 2 项说明</span>
          <div class="stepr"><button title="只检查不写文件：看数据和图片是否齐全；有阻断项会写明去哪里处理">检查交付</button><span class="cap">先检查 · 上次 10:42</span></div>
          <div class="stepr"><button disabled title="不能生成：还有 1 项阻断：按下方明细处理后，重新点“检查交付”">生成交付目录…</button><span class="cap">再生成 · 通过后可用</span></div>
        </div>
        <div class="pop">
          <div class="meta">检查时间 2026-05-26 10:42 · 数据变化后需重新检查</div>
          <h3 class="err">阻断项（1，处理后才能交付）</h3><div id="pb"></div>
          <h3>说明项（2，不阻断交付，会写入交付记录）</h3><div id="pn"></div>
        </div>
      </div>
    </div>
    <!-- 右边：只管选中的这一份 -->
    <div class="stu">
      <div class="shd"><h2>#0007</h2><span class="info" id="info"></span>
        <span class="kh">PgUp / PgDn</span>
        <div class="seg"><button title="看列表里的上一份（PgUp）">上一份</button><button title="看列表里的下一份（PgDn）">下一份</button></div></div>
      <div class="split">
        <div class="center">
          <div class="tabrow">
            <div class="tabs"><span class="on" title="整页卡面和识别叠层">卡面</span><span title="逐张看切图（考号、各题）和这份答卷的完整识别结果 JSON">证据 / JSON</span></div>
            <div class="tools"><div class="seg"><button class="on" title="看正面扫描图和识别叠层">正面</button><button title="看背面扫描图和识别叠层">背面</button></div></div>
          </div>
          <script>document.write(R.legend)</script>
          <script>document.write(R.paper())</script>
          <script>document.write(R.anoms)</script>
        </div>
        <div class="side">
          <div class="hd">客观题答案<span class="sp"></span><small>2 题需核对</small></div>
          <script>document.write(R.answers(5, 11))</script>
          <div class="hd subhd">信息栏与主观题 <span class="help" title="转写：用大模型把手写内容（填空、作文、姓名）转成文字，需要先在设置页配置。不转写也能交付，只是没有文字；不打算再转写时可“放弃未完成转写”，免得挡住交付。">?</span>
            <span class="sp"></span><small>整批转写在左下</small></div>
          <div class="subjs"><script>document.write(R.subj())</script></div>
        </div>
      </div>
    </div>
  </div></div>
  <script>document.write(R.status)</script>
</div>
<script>
  document.getElementById("hint").textContent = R.hint;
  document.getElementById("info").textContent = R.info;
  document.getElementById("pb").innerHTML = R.issues(R.blockers);
  document.getElementById("pn").innerHTML = R.issues(R.notes, "");
  document.getElementById("detBtn").onclick = () => document.body.classList.toggle("detail");
  if (location.hash === "#detail") document.body.classList.add("detail");
</script>
</body></html>
