<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>结果页 A · 就近摆放</title>
<link rel="stylesheet" href="../toolbar/shell.css">
<link rel="stylesheet" href="results-common.css">
<script src="results-common.js"></script>
<style>
  .bar1 { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 60px; background: var(--header); border-bottom: 1px solid var(--line); }
  .bar1 .sp { flex: 1; }
  .bar1 .crumb { display: flex; flex-direction: column; line-height: 1.3; }
  .bar1 .crumb small { font-size: 12px; color: var(--ink3); }
  .deliv { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; background: var(--panel); position: relative; }
  .deliv .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .deliv .step { display: flex; align-items: center; gap: 6px; }
  .deliv .join { width: 22px; height: 1px; background: var(--line2); }
  .deliv .order { font-size: 12px; color: var(--ink3); }
  .hintbar { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 34px; background: var(--warn-bg); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
  .hintbar b { color: var(--warn); font-weight: 600; }
  .body { flex: 1; display: grid; grid-template-columns: 296px 1fr 404px; min-height: 0; }
  .left { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .left .ctl { padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
  .left .ctl .row { display: flex; align-items: center; gap: 8px; }
  .left .ctl .row .sp { flex: 1; }
  .center { background: var(--work); display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 0 20px 12px; }
  .stu { display: flex; align-items: center; gap: 8px; padding: 12px 0 2px; }
  .stu .sp { flex: 1; }
  .stu .nav { display: flex; gap: 0; }
  .stu .nav button:first-child { border-radius: 5px 0 0 5px; } .stu .nav button:last-child { border-radius: 0 5px 5px 0; border-left: 0; }
  .stu .kh { font-size: 12px; color: var(--ink3); }
  .info { font-size: 13px; color: var(--ink2); padding-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabrow { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tabrow .legend { padding-bottom: 7px; }
  .anoms { margin-top: 10px; }
  .side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side .hd { display: flex; align-items: center; gap: 6px; padding: 10px 16px; font-weight: 600; }
  .side .hd .sp { flex: 1; }
  .side .hd small { font-weight: 400; font-size: 12px; color: var(--ink3); }
  .side .subhd { border-top: 1px solid var(--line); }
  .ocrbar { margin: 0 16px 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--work); display: flex; flex-direction: column; gap: 6px; }
  .ocrbar .t { font-size: 12px; color: var(--ink3); }
  .ocrbar .ops { display: flex; gap: 6px; }
  .ocrbar .ops button { height: 28px; }
  .subjs { padding: 0 16px; overflow: hidden; flex: 1; }
  .pop { position: absolute; right: 0; top: calc(100% + 6px); width: 520px; background: var(--work); border: 1px solid var(--line2); border-radius: 7px;
    box-shadow: 0 10px 28px #000b; padding: 12px 14px; z-index: 9; display: none; }
  .pop h3 { font-size: 13px; font-weight: 600; margin: 4px 0 2px; }
  .pop .meta { font-size: 12px; color: var(--ink3); }
  body.detail .pop { display: block; }
</style></head>
<body><div class="app">
  <script>document.write(R.rail)</script>
  <div class="main">
    <!-- 顶栏：左边是哪一批 + 刷新（整批数据），右边是整批最后一步“交付”，先检查再生成 -->
    <div class="bar1">
      <div class="crumb"><h2>第 2 批 · 0526_上午</h2><small>考研管理类综合能力 2026 · 16 份</small></div>
      <button title="重新读取这一批的识别与转写结果；在扫描页重扫、作废后回来点它">刷新</button>
      <span class="sp"></span>
      <div class="deliv">
        <span class="name">交付 <span class="help" title="检查交付：只检查不写文件；阻断项必须处理，说明项可以带着交付。生成交付目录：选一个文件夹，生成最终的 JSON + 图片">?</span></span>
        <span class="step"><span class="order">先</span><button title="只检查不写文件：看数据和图片是否齐全；有阻断项会写明去哪里处理">检查交付</button></span>
        <span class="join"></span>
        <span class="step"><span class="order">再</span><button disabled title="不能生成：还有 1 项阻断：按下方明细处理后，重新点“检查交付”">生成交付目录…</button></span>
        <div class="vsep"></div>
        <span class="pill bad" title="检查时间：2026-05-26 10:42；生成目录时会重新检查">暂不可交付 · 1 项阻断 · 2 项说明</span>
        <button class="link" id="detBtn">明细 ▾</button>
        <div class="pop" id="pop">
          <div class="meta">检查时间 2026-05-26 10:42 · 数据变化后需重新检查</div>
          <h3 class="err">阻断项（1，处理后才能交付）</h3><div id="pb"></div>
          <h3>说明项（2，不阻断交付，会写入交付记录）</h3><div id="pn"></div>
        </div>
      </div>
    </div>
    <div class="hintbar" title="下一步该做什么，以及刚才操作的结果"><b>下一步</b><span id="hint"></span></div>
    <div class="body">
      <!-- 左：学生列表 -->
      <div class="left">
        <div class="ctl">
          <div class="row"><h2>学生</h2><span class="sp"></span><span class="muted">16 / 16 份</span></div>
          <input class="search" placeholder="序号、考号或来源" title="按序号（如 0012）、考号或来源文件名筛选，边输边过滤；清空后显示全部">
          <div class="row"><script>document.write(R.filter)</script></div>
        </div>
        <script>document.write(R.list(7))</script>
      </div>
      <!-- 中：看卡。翻页和正 / 背面就在卡面正上方 -->
      <div class="center">
        <div class="stu">
          <h2>#0007</h2>
          <div class="nav" style="margin-left:6px"><button title="看列表里的上一份（PgUp）">上一份</button><button title="看列表里的下一份（PgDn）">下一份</button></div>
          <span class="kh">PgUp / PgDn</span>
          <span class="sp"></span>
          <div class="seg"><button class="on" title="看正面扫描图和识别叠层">正面</button><button title="看背面扫描图和识别叠层">背面</button></div>
        </div>
        <div class="info" id="info"></div>
        <div class="tabrow">
          <div class="tabs"><span class="on" title="整页卡面和识别叠层">卡面</span><span title="逐张看切图（考号、各题）和这份答卷的完整识别结果 JSON">证据 / JSON</span></div>
          <script>document.write(R.legend)</script>
        </div>
        <script>document.write(R.paper())</script>
        <script>document.write(R.anoms)</script>
      </div>
      <!-- 右：这份卡的答案；转写的整批操作放在主观题区里 -->
      <div class="side">
        <div class="hd">客观题答案<span class="sp"></span><small>2 题需核对</small></div>
        <script>document.write(R.answers(5, 10))</script>
        <div class="hd subhd">信息栏与主观题 <span class="help" title="转写：用大模型把手写内容（填空、作文、姓名）转成文字，需要先在设置页配置。不转写也能交付，只是没有文字；不打算再转写时可“放弃未完成转写”，免得挡住交付。">?</span></div>
        <div class="ocrbar">
          <span class="t">整批转写 · 本批失败 1 项、等待转写 1 项</span>
          <div class="ops"><button title="用大模型把手写内容转成文字：失败的重新转写，没开启转写的一并补做（可选）">补做和重试转写</button>
            <button title="不再转写这 1 项“等待转写”（标为未启用），这样就不挡交付；以后仍可补做">放弃未完成转写…</button></div>
        </div>
        <div class="subjs"><script>document.write(R.subj())</script></div>
      </div>
    </div>
  </div>
  <script>document.write(R.status)</script>
</div>
<script>
  document.getElementById("hint").textContent = R.hint;
  document.getElementById("info").textContent = R.info;
  document.getElementById("pb").innerHTML = R.issues(R.blockers);
  document.getElementById("pn").innerHTML = R.issues(R.notes, "");
  document.getElementById("detBtn").onclick = () => document.body.classList.toggle("detail");
  if (location.hash === "#detail") document.body.classList.add("detail");
</script>
</body></html>
