# 打包 答题卡扫描识别：Windows 安装包（PyInstaller + Inno Setup）与 macOS DMG
# - 手动触发（Actions 页面 Run workflow）或推送 v* 标签时运行
# - 各平台安装包作为 artifact 上传；标签触发时统一附加到对应 Release

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "版本: $v"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen --extra build

      - name: PyInstaller 打包
        run: uv run --no-sync pyinstaller --noconfirm packaging/scan-answer.spec

      - name: 安装 Inno Setup 与中文语言包
        run: |
          choco install innosetup --no-progress -y
          # 简体中文为非官方语言包，下载失败时安装界面退回英文
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging/ChineseSimplified.isl
          } catch {
            Write-Warning "中文语言包下载失败，使用英文界面: $_"
          }

      - name: 生成安装包
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.value }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/installer/*.exe
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple 芯片
            arch: arm64
          - runner: macos-15-intel     # Intel 芯片
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen --extra build

      - name: PyInstaller 打包
        run: uv run --no-sync pyinstaller --noconfirm packaging/scan-answer.spec

      - name: 生成 DMG
        run: |
          name="答题卡扫描识别"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist/installer
          cp -R "dist/$name.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "$name" -srcfolder "$stage" -ov -format UDZO \
            "dist/installer/$name-${{ needs.version.outputs.value }}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/installer/*.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 附加到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
