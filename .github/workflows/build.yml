# 打包 答题卡扫描识别：Windows 安装包（PyInstaller + Inno Setup）与 macOS DMG
# - 发版：修改 src/scan_answer/__init__.py 的 __version__ 并推送到 main，
#   若该版本还没有发布过（不存在 v<版本> 标签），自动打包并创建标签 v<版本> 与 Release
# - 试打包：Actions 页面手动 Run workflow，只上传 artifact，不发布

name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/scan_answer/__init__.py"]

# 同一版本的发布不并发，避免重复创建 Release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # 版本号唯一来源：src/scan_answer/__init__.py 的 __version__
          v=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' src/scan_answer/__init__.py)
          if [ -z "$v" ]; then
            echo "::error::src/scan_answer/__init__.py 里没有找到 __version__"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "版本 $v：手动触发，只打包不发布"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::版本 $v 已发布过（标签 v$v 已存在），跳过打包"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "版本 $v：新版本，打包并发布"
          fi

  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen --extra build

      - name: PyInstaller 打包
        run: uv run --no-sync pyinstaller --noconfirm packaging/scan-answer.spec

      - name: 安装 Inno Setup 与中文语言包
        run: |
          choco install innosetup --no-progress -y
          # 简体中文为非官方语言包，下载失败时安装界面退回英文
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging/ChineseSimplified.isl
          } catch {
            Write-Warning "中文语言包下载失败，使用英文界面: $_"
          }

      - name: 生成安装包
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.value }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/installer/*.exe
          if-no-files-found: error

  macos:
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple 芯片
            arch: arm64
          - runner: macos-15-intel     # Intel 芯片
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen --extra build

      - name: PyInstaller 打包
        run: uv run --no-sync pyinstaller --noconfirm packaging/scan-answer.spec

      - name: 生成 DMG
        run: |
          name="答题卡扫描识别"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" dist/installer
          cp -R "dist/$name.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "$name" -srcfolder "$stage" -ov -format UDZO \
            "dist/installer/scan-answer-${{ needs.version.outputs.value }}-macos-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/installer/*.dmg
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建标签与 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.value }}
        run: |
          # 标签打在触发本次运行的提交上，与安装包内容一致
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
