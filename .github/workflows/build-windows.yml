# 在 Windows 上打包 答题卡扫描识别 安装包（PyInstaller + Inno Setup）
# - 手动触发（Actions 页面 Run workflow）或推送 v* 标签时运行
# - 安装包作为 artifact 上传；标签触发时同时附加到对应 Release

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: 安装依赖（按 uv.lock）
        run: uv sync --frozen --extra build --no-dev

      - name: 确定版本号
        id: version
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $v"

      - name: PyInstaller 打包
        run: uv run --no-sync pyinstaller --noconfirm packaging/scan-answer.spec

      - name: 安装 Inno Setup 与中文语言包
        run: |
          choco install innosetup --no-progress -y
          # 简体中文为非官方语言包，下载失败时安装界面退回英文
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile packaging/ChineseSimplified.isl
          } catch {
            Write-Warning "中文语言包下载失败，使用英文界面: $_"
          }

      - name: 生成安装包
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: scan-answer-windows-${{ steps.version.outputs.value }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: 附加到 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist/installer/*.exe) --clobber
