[project]
name = "scan-answer"
version = "0.1.0"
description = "答题卡扫描识别"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "opencv-python-headless>=5.0",
    "zxing-cpp>=3.0",
    "pillow>=12.0",
    "PySide6-Essentials>=6.10",
    "pypdfium2>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pymupdf>=1.26",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
scan-answer = "scan_answer.cli:main"

[project.gui-scripts]
scan-answer-gui = "scan_answer.ui.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: 完整回归测试（200 张模拟卡，约 4 分钟）"]
addopts = "-m 'not slow'"
